<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="300">
    <title>BFI National Archive — autoingest</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="header">
    <h1>BFI National Archive — Autoingest stalls and errors for KLC Developers</h1>
    <div class="button-bar">
        <div class="filter-group">
            <input type="text" id="searchInput" placeholder="Search file name / status / error&hellip;" autocomplete="off">
        </div>
        <button onclick="location.reload()" class="btn" title="Reload page">⟳ Refresh</button>
    </div>
    <div id="stats" class="stats-bar">Loading&hellip;</div>
</div>

<table id="fileTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>File Name</th>
            <th>Status</th>
            <th>Source</th>
            <th>File Size</th>
            <th>MIME</th>
            <th>Error</th>
            <th>Tape</th>
            <th>Proxy</th>
            <th>Created</th>
            <th>Updated</th>
            <th style="background:#c0392b;color:#fff">⚠ Actions</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="12">Loading&hellip;</td></tr>
    </tbody>
</table>

<div id="lastUpdate" class="footer"></div>

<script>
let searchTimeout = null;

async function loadFiles() {
    var params = new URLSearchParams();
    var search = document.getElementById("searchInput").value.trim();
    if (search) params.set("search", search);

    var qs = params.toString();
    var url = qs ? "/api/files?" + qs : "/api/files";

    try {
        var resp = await fetch(url);
        var files = await resp.json();
        renderTable(files);
    } catch (e) {
        document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="12" class="error-cell">Error loading data</td></tr>';
    }
    document.getElementById("lastUpdate").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    setTimeout(loadFiles, 30000);
}

function getActionOptions(status) {
    var earlierMap = {
        "assessed": "No Status",
        "generating_checksum": "assessed",
        "checksummed": "assessed",
        "cataloguing": "checksummed",
        "File cleared for ingest": "checksummed",
        "bp_json_pending": "File cleared for ingest",
        "validating": "File cleared for ingest",
        "verified": "File cleared for ingest",
        "encoding": "verified",
        "encoded": "verified",
        "generating_images": "verified",
        "encoding_complete": "verified",
        "deleting_source": "encoding_complete",
        "complete": "encoding_complete",
        "updating_cid": "complete",
        "All stages complete": "complete",
    };
    var options = [];
    options.push({value: "refresh", label: "↻ Return to pre-ingest"});
    options.push({value: "validator", label: "↺ Return to pre-validation"});
    if (earlierMap[status]) {
        options.push({value: "reset:" + earlierMap[status], label: "⚙ Status Reset → " + earlierMap[status]});
    }
    options.push({value: "delete", label: "✕ Delete record"});
    return options;
}

function renderTable(files) {
    var tbody = document.getElementById("tableBody");
    if (files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12">No files found</td></tr>';
        return;
    }
    var html = "";
    for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var statusClass =
            f.file_status === "All stages complete" ? "status-ok" :
            f.file_status === "complete" ? "status-ok" :
            f.file_status === "encoding_complete" ? "status-ok" :
            f.file_status === "verified" ? "status-ok" :
            f.file_status === "Failed assessment" ? "status-fail" :
            f.file_status === "failed" ? "status-fail" :
            f.file_status === "Error" ? "status-error" :
            f.file_status && f.file_status.toLowerCase().indexOf("fail") !== -1 ? "status-error" :
            "status-pending";

        var options = getActionOptions(f.file_status);
        var selectId = "actionSelect_" + f.id;
        var selectHtml = '<select id="' + selectId + '" class="action-select">';
        for (var j = 0; j < options.length; j++) {
            selectHtml += '<option value="' + esc(options[j].value) + '">' + esc(options[j].label) + '</option>';
        }
        selectHtml += '</select>';

        html +=
            '<tr>' +
            '<td>' + esc(f.id) + '</td>' +
            '<td class="filename" title="' + esc(f.file_name) + '">' + esc(f.file_name) + '</td>' +
            '<td><span class="status ' + statusClass + '">' + esc(f.file_status) + '</span></td>' +
            '<td>' + esc(f.source) + '</td>' +
            '<td>' + esc(f.file_size_fmt) + '</td>' +
            '<td>' + esc(f.mime_type) + '</td>' +
            '<td class="error-cell" title="' + esc(f.error_message || "") + '">' +
                (f.error_message ? '⚠ ' + esc(f.error_message.substring(0, 60)) : "") +
            '</td>' +
            '<td class="checkmark">' + (f.tape_verified ? '✓' : '') + '</td>' +
            '<td class="checkmark">' + (f.proxy_created ? '✓' : '') + '</td>' +
            '<td>' + esc(f.created_at) + '</td>' +
            '<td>' + esc(f.updated_at) + '</td>' +
            '<td>' +
                selectHtml +
                '<button class="btn-submit" onclick="submitAction(' + f.id + ',\'' + esc(f.file_name) + '\',\'' + esc(f.file_status) + '\')" title="Execute selected action">Submit</button>' +
            '</td>' +
            '</tr>';
    }
    tbody.innerHTML = html;
}

function esc(v) {
    if (v == null) return "";
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function submitAction(id, name, status) {
    var select = document.getElementById("actionSelect_" + id);
    if (!select) return;
    var value = select.value;

    if (value === "refresh") {
        if (!confirm('Reset file "' + name + '" for re-ingest?\n\nThis will clear all accrued metadata and return the file to "No Status".')) return;
        await doAction("/api/refresh/" + id, "POST", "refresh", name);
    } else if (value === "validator") {
        if (!confirm('⚠ WARNING: Reset validation state for "' + name + '"?\n\nA CID Media Record and/or Black Pearl file may need to be deleted manually before proceeding.\n\nThis returns the file to "File cleared for ingest". bp_job_id is retained.\n\nContinue?')) return;
        await doAction("/api/validator-reset/" + id, "POST", "validator", name);
    } else if (value.startsWith("reset:")) {
        var newStatus = value.split(":")[1];
        if (!confirm('Reset status for "' + name + '" from "' + status + '" to "' + newStatus + '"?\n\nError message will be cleared.')) return;
        await doAction("/api/status-reset/" + id, "POST", "status", name, {new_status: newStatus});
    } else if (value === "delete") {
        if (!confirm('Permanently delete "' + name + '" from the database?\n\nThis removes the row. The file on disk is not affected.')) return;
        await doAction("/api/delete/" + id, "DELETE", "delete", name);
    }
}

async function doAction(url, method, actionType, name, body) {
    var opts = {method: method};
    if (body) {
        opts.headers = {"Content-Type": "application/json"};
        opts.body = JSON.stringify(body);
    }
    try {
        var resp = await fetch(url, opts);
        var result = await resp.json();
        if (result.success) {
            alert(result.message);
            loadFiles();
        } else {
            alert("Error: " + result.error);
        }
    } catch (e) {
        alert("Request failed");
    }
}

async function loadStats() {
    try {
        var resp = await fetch("/api/stats");
        var stats = await resp.json();
        var bar = document.getElementById("stats");
        bar.innerHTML = stats.map(function(s) {
            return '<span class="stat"><b>' + s.count + '</b> ' + esc(s.status) + '</span>';
        }).join(" · ");
    } catch (e) {}
}

loadFiles();
loadStats();
setInterval(loadStats, 60000);

document.getElementById("searchInput").addEventListener("input", function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadFiles, 350);
});
</script>

</body>
</html>
