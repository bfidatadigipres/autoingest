<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="300">
    <title>BFI National Archive — autoingest</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="header">
    <h1>BFI National Archive — autoingest</h1>
    <div class="button-bar">
        <button onclick="location.reload()" class="btn" title="Reload page">⟳ Refresh</button>
        <button id="btnProgress" class="btn" onclick="toggleProgress()">View Progress</button>
        {% if confluence_url %}
        <a href="{{ confluence_url }}" target="_blank" rel="noopener" class="btn">Instructions</a>
        {% endif %}
        {% if service_desk_url %}
        <a href="{{ service_desk_url }}" target="_blank" rel="noopener" class="btn">Service Desk</a>
        {% endif %}
    </div>
    <div id="stats" class="stats-bar">Loading&hellip;</div>
</div>

<table id="fileTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>File Name</th>
            <th>Status</th>
            <th>Source</th>
            <th>File Size</th>
            <th>MIME</th>
            <th>Error</th>
            <th>Tape</th>
            <th>Proxy</th>
            <th>Created</th>
            <th>Updated</th>
            <th></th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="12">Loading&hellip;</td></tr>
    </tbody>
</table>

<div id="lastUpdate" class="footer"></div>

<script>
let showProgressOnly = false;

function toggleProgress() {
    showProgressOnly = !showProgressOnly;
    var btn = document.getElementById("btnProgress");
    btn.textContent = showProgressOnly ? "Show All" : "View Progress";
    btn.classList.toggle("active", showProgressOnly);
    loadFiles();
}

async function loadFiles() {
    var url = showProgressOnly ? "/api/files?status=progress" : "/api/files";
    try {
        var resp = await fetch(url);
        var files = await resp.json();
        renderTable(files);
    } catch (e) {
        document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="12" class="error-cell">Error loading data</td></tr>';
    }
    document.getElementById("lastUpdate").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    setTimeout(loadFiles, 30000);
}

function renderTable(files) {
    var tbody = document.getElementById("tableBody");
    if (files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="12">No files found</td></tr>';
        return;
    }
    var html = "";
    for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var statusClass =
            f.file_status === "complete" ? "status-ok" :
            f.file_status === "Failed assessment" ? "status-fail" :
            f.file_status === "Error" ? "status-error" :
            "status-pending";
        html +=
            '<tr>' +
            '<td>' + esc(f.id) + '</td>' +
            '<td class="filename" title="' + esc(f.file_name) + '">' + esc(f.file_name) + '</td>' +
            '<td><span class="status ' + statusClass + '">' + esc(f.file_status) + '</span></td>' +
            '<td>' + esc(f.source) + '</td>' +
            '<td>' + esc(f.file_size_fmt) + '</td>' +
            '<td>' + esc(f.mime_type) + '</td>' +
            '<td class="error-cell" title="' + esc(f.error_message || "") + '">' +
                (f.error_message ? '⚠ ' + esc(f.error_message.substring(0, 60)) : "") +
            '</td>' +
            '<td class="checkmark">' + (f.tape_verified ? '✓' : '') + '</td>' +
            '<td class="checkmark">' + (f.proxy_created ? '✓' : '') + '</td>' +
            '<td>' + esc(f.created_at) + '</td>' +
            '<td>' + esc(f.updated_at) + '</td>' +
            '<td>' +
                '<button class="btn-retry" onclick="refreshFile(' + f.id + ',\'' + esc(f.file_name) + '\')" title="Reset for re-ingest">↻</button>' +
            '</td>' +
            '</tr>';
    }
    tbody.innerHTML = html;
}

function esc(v) {
    if (v == null) return "";
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

async function refreshFile(id, name) {
    if (!confirm('Reset file "' + name + '" for re-ingest?\n\nThis will move the file back to the watch folder and queue it for processing.')) return;
    var btn = event.target;
    btn.disabled = true;
    btn.textContent = "…";
    try {
        var resp = await fetch("/api/refresh/" + id, { method: "POST" });
        var result = await resp.json();
        if (result.success) {
            alert(result.message);
            loadFiles();
        } else {
            alert("Error: " + result.error);
        }
    } catch (e) {
        alert("Request failed");
    }
    btn.disabled = false;
    btn.textContent = "↻";
}

async function loadStats() {
    try {
        var resp = await fetch("/api/stats");
        var stats = await resp.json();
        var bar = document.getElementById("stats");
        bar.innerHTML = stats.map(function(s) {
            return '<span class="stat"><b>' + s.count + '</b> ' + esc(s.status) + '</span>';
        }).join(" · ");
    } catch (e) {}
}

loadFiles();
loadStats();
setInterval(loadStats, 60000);
</script>

</body>
</html>
