<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="300">
    <title>BFI National Archive — KLC File Progress</title>
    <link rel="stylesheet" href="/static/klc.css">
</head>
<body>

<div class="brand-bar">
    <img src="/static/logo.png" alt="BFI" class="brand-logo">
    <span class="brand-title">BFI National Archive — Autoingest Dashboard</span>
    <div class="brand-actions">
        <button onclick="location.reload()" class="btn-refresh">Refresh</button>
        {% if confluence_url %}
        <a href="{{ confluence_url }}" target="_blank" rel="noopener" class="btn-servicedesk">Instructions</a>
        {% endif %}
        {% if service_desk_url %}
        <a href="{{ service_desk_url }}" target="_blank" rel="noopener" class="btn-servicedesk">Service Desk</a>
        {% endif %}
    </div>
</div>

<div class="filter-bar">
    <label class="filter-label">
        Search
        <input type="text" id="searchInput" placeholder="file name / status / error&hellip;" autocomplete="off">
    </label>
    <label class="filter-label">
        Storage
        <select id="storageFilter">
            <option value="">All</option>
            {% for opt in storage_options %}
            <option value="{{ opt }}">{{ opt }}</option>
            {% endfor %}
        </select>
    </label>
    <label class="filter-label">
        Errors
        <select id="errorFilter">
            <option value="">All files</option>
            <option value="yes">With errors</option>
            <option value="no">Without errors</option>
        </select>
    </label>
    <span id="resultCount" class="result-count"></span>
</div>

<div class="table-wrapper">
<table id="fileTable">
    <thead>
        <tr>
            <th>File Name</th>
            <th>Status</th>
            <th>Error</th>
            <th>Storage</th>
            <th class="num">File Size</th>
            <th>Media Type</th>
            <th>MD5 checksum</th>
            <th>File format</th>
            <th>Last updated</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="9">Loading&hellip;</td></tr>
    </tbody>
</table>
</div>

<div id="lastUpdate" class="footer"></div>

<script>
let guidance = {};
let searchTimeout = null;
let tooltipLeave = null;

async function loadGuidance() {
    try {
        var resp = await fetch("/klc/api/guidance");
        guidance = await resp.json();
    } catch (e) {}
}

function matchGuidance(errorText) {
    if (!errorText || !guidance) return guidance["_default"] || {text: "", link: ""};
    var keys = Object.keys(guidance);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i] === "_default") continue;
        if (errorText.toLowerCase().indexOf(keys[i].toLowerCase()) !== -1) {
            return guidance[keys[i]];
        }
    }
    return guidance["_default"] || {text: "", link: ""};
}


async function loadFiles() {
    var search = document.getElementById("searchInput").value;
    var storage = document.getElementById("storageFilter").value;
    var hasError = document.getElementById("errorFilter").value;

    var params = new URLSearchParams();
    if (search) params.set("search", search);
    if (storage) params.set("storage", storage);
    if (hasError) params.set("has_error", hasError);
    params.set("limit", "1000");

    try {
        var resp = await fetch("/klc/api/files?" + params.toString());
        var files = await resp.json();
        renderTable(files);
    } catch (e) {
        document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="9" class="error-cell">Error loading data</td></tr>';
    }
    document.getElementById("lastUpdate").textContent =
        "Last updated: " + new Date().toLocaleTimeString();
    setTimeout(loadFiles, 30000);
}

function renderTable(files) {
    var tbody = document.getElementById("tableBody");
    document.getElementById("resultCount").textContent =
        files.length + " file" + (files.length !== 1 ? "s" : "");

    if (files.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9">No files found</td></tr>';
        return;
    }

    var html = "";
    for (var i = 0; i < files.length; i++) {
        var f = files[i];
        var errorText = f.error_message || "";
        var g = matchGuidance(errorText);

        var statusClass =
            f.file_status === "All stages complete" ? "status-ok" :
            f.file_status === "complete" ? "status-ok" :
            f.file_status === "encoding_complete" ? "status-ok" :
            f.file_status === "Failed assessment" ? "status-fail" :
            f.file_status === "failed" ? "status-fail" :
            f.file_status === "Error" ? "status-error" :
            f.file_status && f.file_status.toLowerCase().indexOf("fail") !== -1 ? "status-error" :
            "status-pending";

        var errorCell = "";
        if (errorText) {
            errorCell =
                '<span class="error-icon" '
                + 'data-error="' + escAttr(errorText) + '" '
                + 'data-guidance="' + escAttr(g.text || "") + '" '
                + 'data-link="' + escAttr(g.link || "") + '">'
                + '<a href="' + escAttr(g.link || "") + '" target="_blank" rel="noopener" class="error-link">'
                + '&#9888; ' + esc(errorText.substring(0, 100))
                + '</a></span>';
        }

        html +=
            '<tr>' +
            '<td class="filename" title="' + esc(f.file_name) + '">' + esc(f.file_name) + '</td>' +
            '<td><span class="status ' + statusClass + '">' + esc(f.file_status) + '</span></td>' +
            '<td class="error-cell">' + errorCell + '</td>' +
            '<td>' + esc(f.storage) + '</td>' +
            '<td class="num">' + esc(f.file_size_fmt) + '</td>' +
            '<td>' + esc(f.mime_type) + '</td>' +
            '<td class="mono">' + esc(f.checksum_md5_short) + '</td>' +
            '<td>' + esc(f.file_fmt) + '</td>' +
            '<td>' + esc(f.updated_at) + '</td>' +
            '</tr>';
    }
    tbody.innerHTML = html;
}

function esc(v) {
    if (v == null) return "";
    return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function escAttr(v) {
    return esc(v).replace(/\\/g, "\\\\");
}

function showTooltip(ev, errorText, guidanceText, linkUrl) {
    clearTimeout(tooltipLeave);
    var el = document.getElementById("tooltip");
    if (!el) {
        el = document.createElement("div");
        el.id = "tooltip";
        el.className = "tooltip";
        document.body.appendChild(el);
    }
    var html = '<div class="tooltip-inner">';
    html += '<div class="tooltip-header">Error Details</div>';
    html += '<div class="tooltip-body">' + esc(errorText) + '</div>';
    if (guidanceText) {
        html += '<div class="tooltip-guidance">' + esc(guidanceText) + '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
    el.style.display = "block";

    var rect = ev.target.getBoundingClientRect();
    var top = rect.bottom + window.scrollY + 6;
    var left = rect.left + window.scrollX;
    if (left + 380 > window.innerWidth) left = window.innerWidth - 390;
    if (top + 200 > window.innerHeight + window.scrollY) top = rect.top + window.scrollY - 210;
    el.style.top = top + "px";
    el.style.left = left + "px";
}

function hideTooltip() {
    tooltipLeave = setTimeout(function() {
        var el = document.getElementById("tooltip");
        if (el) el.style.display = "none";
    }, 300);
}

document.getElementById("tableBody").addEventListener("mouseover", function(ev) {
    var span = ev.target.closest(".error-icon");
    if (!span) { hideTooltip(); return; }
    clearTimeout(tooltipLeave);
    showTooltip(ev, span.dataset.error, span.dataset.guidance, span.dataset.link);
});
document.getElementById("tableBody").addEventListener("mouseout", function(ev) {
    if (ev.target.closest(".error-icon")) hideTooltip();
});

document.getElementById("searchInput").addEventListener("input", function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(loadFiles, 350);
});
document.getElementById("storageFilter").addEventListener("change", loadFiles);
document.getElementById("errorFilter").addEventListener("change", loadFiles);

loadGuidance();
loadFiles();
</script>

</body>
</html>
