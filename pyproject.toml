[project]
name = "autoingest"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.12.21",
    "dagster-dg-cli>=1.12.21",
    "dagster-postgres>=0.28.21",
    "dagster-webserver>=1.12.21",
    "dagster-celery[redis]>=0.22",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "ffmpeg-python>=0.2.0",
    "python-magic>=0.4.27",
    "pytz>=2026.1.post1",
    "requests>=2.33.0",
    "tenacity>=9.1.4",
    "xmltodict>=1.0.4",
    "Pillow",
    "ds3_python3_sdk",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.dagster]
module_name = "media_pipeline.definitions"
