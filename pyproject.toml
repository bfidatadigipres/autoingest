[project]
name = "autoingest"
requires-python = "==3.13.*"
version = "0.1.0"
dependencies = [
    "dagster",
    "dagster-dg",
    "dagster-postgres",
    "dagster-webserver",
    "dagster-celery[redis]",
    "sqlalchemy",
    "psycopg2-binary",
    "redis",
    "ffmpeg-python",
    "python-magic",
    "pytz",
    "requests",
    "tenacity",
    "xmltodict",
    "pillow",
    "xxhash",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg",
    "pytest",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.dagster]
module_name = "autoingest.definitions"

[tool.setuptools.packages.find]
include = ["autoingest*"]
